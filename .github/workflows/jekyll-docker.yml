<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>XOSHNAW MARKET</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  background:#f3f4f6;
  color:#111827;
  padding-bottom:80px;
}

header{
  background:#111827;
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 12px #0003;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#facc15;
}

.userBox{
  display:flex;
  align-items:center;
  gap:8px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.loginBtn{
  background:#facc15;
  color:#111827;
}

.logoutBtn{
  background:#ef4444;
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 14px;
}

.hero{
  background:linear-gradient(135deg,#111827,#374151);
  color:white;
  border-radius:20px;
  padding:28px 20px;
  margin-bottom:20px;
}

.hero h1{
  font-size:30px;
  margin-bottom:10px;
}

.hero p{
  color:#d1d5db;
}

.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:20px;
}

.nav button{
  background:white;
  border:1px solid #ddd;
  white-space:nowrap;
}

.nav button.active{
  background:#111827;
  color:white;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 15px #00000012;
  border:1px solid #e5e7eb;
}

.productImg{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  background:#e5e7eb;
}

.cardBody{
  padding:15px;
}

.card h3{
  margin-bottom:8px;
}

.price{
  color:#16a34a;
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.bidBtn{
  width:100%;
  background:#16a34a;
  color:white;
}

.liveCard{
  background:#111827;
  color:white;
}

.liveScreen{
  height:220px;
  background:
    radial-gradient(circle at center,#374151,#030712);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  font-size:60px;
}

.liveBadge{
  position:absolute;
  top:12px;
  right:12px;
  background:#ef4444;
  color:white;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
}

.viewers{
  position:absolute;
  top:12px;
  left:12px;
  background:#0009;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
}

.liveBody{
  padding:15px;
}

.watchBtn{
  background:#ef4444;
  color:white;
  width:100%;
}

.formBox{
  max-width:450px;
  margin:20px auto;
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 3px 15px #0001;
}

.formBox h2{
  margin-bottom:18px;
}

input,select{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

input:focus,select:focus{
  border-color:#111827;
}

.submit{
  width:100%;
  background:#111827;
  color:white;
}

.account{
  background:white;
  padding:20px;
  border-radius:18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.stat{
  background:#f3f4f6;
  padding:15px;
  text-align:center;
  border-radius:12px;
}

.stat b{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.empty{
  text-align:center;
  background:white;
  padding:35px;
  border-radius:15px;
  color:#6b7280;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modalBox{
  background:white;
  width:100%;
  max-width:430px;
  border-radius:18px;
  padding:22px;
  position:relative;
}

.close{
  position:absolute;
  left:12px;
  top:12px;
  background:#ef4444;
  color:white;
  padding:6px 10px;
}

.notice{
  padding:12px;
  border-radius:10px;
  background:#fef3c7;
  margin-bottom:12px;
  display:none;
}

footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  color:white;
  text-align:center;
  padding:13px;
  z-index:900;
}

@media(max-width:600px){
  .hero h1{
    font-size:24px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .productImg{
    height:150px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">XOSHNAW MARKET</div>

    <div class="userBox">
      <span id="userName">میوان</span>
      <button id="loginButton" class="loginBtn" onclick="openLogin()">
        چوونەژوورەوە
      </button>
      <button id="logoutButton" class="logoutBtn" onclick="logout()" style="display:none">
        دەرچوون
      </button>
    </div>
  </div>
</header>

<main class="container">

  <div class="hero">
    <h1>بەخێربێیت بۆ XOSHNAW MARKET</h1>
    <p>بازاڕ، مزایدە و Live ـی XOSHNAW MARKET</p>
  </div>

  <div class="nav">
    <button class="active" onclick="showSection('home',this)">🏠 سەرەکی</button>
    <button onclick="showSection('market',this)">🛒 بازاڕ</button>
    <button onclick="showSection('live',this)">🔴 Live</button>
    <button onclick="showSection('auction',this)">🔨 مزایدە</button>
    <button onclick="showSection('account',this)">👤 هەژمار</button>
  </div>

  <!-- HOME -->
  <section id="home" class="section active">

    <h2 style="margin-bottom:15px">🔥 بەشە چالاکەکان</h2>

    <div class="grid">

      <div class="card liveCard">
        <div class="liveScreen">
          📹
          <span class="liveBadge">LIVE</span>
          <span class="viewers">👁️ <span id="homeViewers">128</span></span>
        </div>

        <div class="liveBody">
          <h3>Live ـی XOSHNAW</h3>
          <p style="margin:8px 0;color:#d1d5db">
            ئێستا Live بەردەستە
          </p>
          <button class="watchBtn" onclick="openLive()">
            بینینی Live
          </button>
        </div>
      </div>

      <div class="card">
        <div class="productImg">📱</div>

        <div class="cardBody">
          <h3>مۆبایل</h3>
          <div class="price">$250</div>
          <button class="bidBtn" onclick="placeBid('مۆبایل')">
            Bid بکە
          </button>
        </div>
      </div>

      <div class="card">
        <div class="productImg">💻</div>

        <div class="cardBody">
          <h3>Laptop</h3>
          <div class="price">$500</div>
          <button class="bidBtn" onclick="placeBid('Laptop')">
            Bid بکە
          </button>
        </div>
      </div>

    </div>
  </section>

  <!-- MARKET -->
  <section id="market" class="section">

    <h2 style="margin-bottom:15px">🛒 بازاڕ</h2>

    <div class="grid">

      <div class="card">
        <div class="productImg">📱</div>
        <div class="cardBody">
          <h3>iPhone</h3>
          <p>مۆبایلی نوێ</p>
          <div class="price">$700</div>
          <button class="bidBtn" onclick="buyProduct('iPhone')">
            کڕین
          </button>
        </div>
      </div>

      <div class="card">
        <div class="productImg">💻</div>
        <div class="cardBody">
          <h3>Laptop</h3>
          <p>Laptop ـی باش</p>
          <div class="price">$850</div>
          <button class="bidBtn" onclick="buyProduct('Laptop')">
            کڕین
          </button>
        </div>
      </div>

      <div class="card">
        <div class="productImg">🎧</div>
        <div class="cardBody">
          <h3>Headphone</h3>
          <p>کوالێتی بەرز</p>
          <div class="price">$80</div>
          <button class="bidBtn" onclick="buyProduct('Headphone')">
            کڕین
          </button>
        </div>
      </div>

    </div>
  </section>

  <!-- LIVE -->
  <section id="live" class="section">

    <h2 style="margin-bottom:15px">🔴 Live</h2>

    <div class="card liveCard">

      <div class="liveScreen" style="height:350px">
        📹
        <span class="liveBadge">LIVE NOW</span>
        <span class="viewers">
          👁️ <span id="liveViewers">128</span> بینەر
        </span>
      </div>

      <div class="liveBody">

        <h2>XOSHNAW MARKET Live</h2>

        <p style="margin:10px 0;color:#d1d5db">
          بەخێربێن بۆ Live ـی XOSHNAW MARKET
        </p>

        <button class="watchBtn" onclick="joinLive()">
          👁️ بەشداری Live
        </button>

      </div>

    </div>

  </section>

  <!-- AUCTION -->
  <section id="auction" class="section">

    <h2 style="margin-bottom:15px">🔨 مزایدە</h2>

    <div class="grid">

      <div class="card">

        <div class="productImg">📱</div>

        <div class="cardBody">

          <h3>مۆبایل Pro</h3>

          <p>نرخی دەستپێک</p>

          <div class="price">
            $300
          </div>

          <button class="bidBtn" onclick="placeBid('مۆبایل Pro')">
            🔨 Bid ـی نوێ
          </button>

        </div>

      </div>

      <div class="card">

        <div class="productImg">🚗</div>

        <div class="cardBody">

          <h3>ئۆتۆمبێل</h3>

          <p>مزایدەی کراوە</p>

          <div class="price">
            $5,000
          </div>

          <button class="bidBtn" onclick="placeBid('ئۆتۆمبێل')">
            🔨 Bid ـی نوێ
          </button>

        </div>

      </div>

    </div>

  </section>

  <!-- ACCOUNT -->
  <section id="account" class="section">

    <div id="accountGuest" class="empty">

      <h2>👤 هەژمار</h2>

      <p style="margin:12px 0">
        بۆ بەکارهێنانی هەموو تایبەتمەندییەکان هەژمار دروست بکە.
      </p>

      <button class="loginBtn" onclick="openLogin()">
        دروستکردنی هەژمار
      </button>

    </div>

    <div id="accountUser" class="account" style="display:none">

      <h2>👤 هەژماری من</h2>

      <h3 id="accountName" style="margin-top:15px"></h3>

      <p id="accountEmail" style="margin-top:6px;color:#6b7280"></p>

      <div class="stats">

        <div class="stat">
          <b id="bidCount">0</b>
          Bid
        </div>

        <div class="stat">
          <b id="purchaseCount">0</b>
          کڕین
        </div>

        <div class="stat">
          <b id="liveCount">0</b>
          Live
        </div>

      </div>

    </div>

  </section>

</main>

<footer>
  XOSHNAW MARKET © 2026
</footer>


<!-- LOGIN / REGISTER MODAL -->

<div id="authModal" class="modal">

  <div class="modalBox">

    <button class="close" onclick="closeLogin()">×</button>

    <h2 id="authTitle">دروستکردنی هەژمار</h2>

    <div id="notice" class="notice"></div>

    <input id="nameInput" type="text" placeholder="ناوی تەواو">

    <input id="emailInput" type="email" placeholder="ئیمەیڵ">

    <input id="passwordInput" type="password" placeholder="وشەی نهێنی">

    <button class="submit" onclick="register()">
      دروستکردنی هەژمار
    </button>

    <p style="text-align:center;margin-top:15px">
      هەژمارت هەیە؟
      <button onclick="showLoginMode()" style="padding:4px;background:none;color:#2563eb">
        چوونەژوورەوە
      </button>
    </p>

  </div>

</div>


<script>

let user = JSON.parse(localStorage.getItem("xoshUser") || "null");

let bids = Number(localStorage.getItem("xoshBids") || 0);

let purchases = Number(localStorage.getItem("xoshPurchases") || 0);

let lives = Number(localStorage.getItem("xoshLives") || 0);


/* SECTION */

function showSection(id,btn){

  document.querySelectorAll(".section").forEach(s=>{
    s.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.remove("active");
  });

  if(btn) btn.classList.add("active");

  updateAccount();

}


/* AUTH */

function openLogin(){

  document.getElementById("authModal").classList.add("show");

}

function closeLogin(){

  document.getElementById("authModal").classList.remove("show");

}

function showNotice(text){

  const n=document.getElementById("notice");

  n.innerText=text;

  n.style.display="block";

}

function register(){

  const name=document.getElementById("nameInput").value.trim();

  const email=document.getElementById("emailInput").value.trim();

  const password=document.getElementById("passwordInput").value;

  if(!name || !email || !password){

    showNotice("تکایە هەموو خانەکان پڕ بکەرەوە.");

    return;

  }

  user={
    name:name,
    email:email
  };

  localStorage.setItem("xoshUser",JSON.stringify(user));

  closeLogin();

  updateUser();

  alert("هەژمارەکەت بە سەرکەوتوویی دروست کرا ✅");

}


function showLoginMode(){

  document.getElementById("authTitle").innerText="چوونەژوورەوە";

  document.querySelector(".submit").innerText="چوونەژوورەوە";

  document.querySelector(".submit").onclick=login;

}


function login(){

  const email=document.getElementById("emailInput").value.trim();

  const password=document.getElementById("passwordInput").value;

  if(!email || !password){

    showNotice("ئیمەیڵ و وشەی نهێنی بنووسە.");

    return;

  }

  user={
    name:email.split("@")[0],
    email:email
  };

  localStorage.setItem("xoshUser",JSON.stringify(user));

  closeLogin();

  updateUser();

  alert("بە سەرکەوتوویی چوویتە ژوورەوە ✅");

}


function logout(){

  localStorage.removeItem("xoshUser");

  user=null;

  updateUser();

  showSection("home",document.querySelector(".nav button"));

}


/* USER */

function updateUser(){

  const name=document.getElementById("userName");

  const loginBtn=document.getElementById("loginButton");

  const logoutBtn=document.getElementById("logoutButton");

  if(user){

    name.innerText=user.name;

    loginBtn.style.display="none";

    logoutBtn.style.display="block";

  }else{

    name.innerText="میوان";

    loginBtn.style.display="block";

    logoutBtn.style.display="none";

  }

  updateAccount();

}


function updateAccount(){

  const guest=document.getElementById("accountGuest");

  const account=document.getElementById("accountUser");

  if(!user){

    guest.style.display="block";

    account.style.display="none";

    return;

  }

  guest.style.display="none";

  account.style.display="block";

  document.getElementById("accountName").innerText=user.name;

  document.getElementById("accountEmail").innerText=user.email;

  document.getElementById("bidCount").innerText=bids;

  document.getElementById("purchaseCount").innerText=purchases;

  document.getElementById("liveCount").innerText=lives;

}


/* BID */

function placeBid(product){

  if(!user){

    alert("تکایە سەرەتا هەژمار دروست بکە یان بچۆ ژوورەوە.");

    openLogin();

    return;

  }

  bids++;

  localStorage.setItem("xoshBids",bids);

  updateAccount();

  alert("Bid ـەکەت بۆ " + product + " تۆمار کرا ✅");

}


/* PURCHASE */

function buyProduct(product){

  if(!user){

    alert("بۆ کڕین پێویستە هەژمار هەبێت.");

    openLogin();

    return;

  }

  purchases++;

  localStorage.setItem("xoshPurchases",purchases);

  updateAccount();

  alert("داواکاری کڕینی " + product + " تۆمار کرا ✅");

}


/* LIVE */

function openLive(){

  showSection(
    "live",
    document.querySelectorAll(".nav button")[2]
  );

}


function joinLive(){

  if(!user){

    alert("بۆ بەشداری Live تکایە هەژمار دروست بکە.");

    openLogin();

    return;

  }

  lives++;

  localStorage.setItem("xoshLives",lives);

  let viewers=Number(
    document.getElementById("liveViewers").innerText
  );

  viewers++;

  document.getElementById("liveViewers").innerText=viewers;

  document.getElementById("homeViewers").innerText=viewers;

  updateAccount();

  alert("چوویتە ناو Live ✅");

}


/* FAKE LIVE VIEWERS */

setInterval(()=>{

  let home=document.getElementById("homeViewers");

  let live=document.getElementById("liveViewers");

  let number=Number(home.innerText);

  if(Math.random()>0.5){

    number += Math.random()>0.5 ? 1 : -1;

    if(number<1) number=1;

    home.innerText=number;

    live.innerText=number;

  }

},4000);


/* START */

updateUser();

</script>

</body>
</html>
